[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "slurm-avail"
version = "0.5.1"
description = "A configurable terminal dashboard for Slurm cluster availability"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["HPC", "Slurm", "TUI", "GPU", "cluster"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console :: Curses",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Monitoring",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/LukasBuschmann/slurm-avail"
Repository = "https://github.com/LukasBuschmann/slurm-avail"
Issues = "https://github.com/LukasBuschmann/slurm-avail/issues"

[project.scripts]
slurm-avail = "slurm_avail.cli:main"

[project.optional-dependencies]
binary = [
  "pyinstaller>=6.16,<7",
]
dev = [
  "build>=1.2",
  "pytest>=8",
  "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/slurm_avail"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
